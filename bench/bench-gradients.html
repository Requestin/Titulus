<!doctype html>
<!--
  bench/bench-gradients.html — animated linear/radial-gradient backgrounds.
  P0 Performance Matrix entry: gradient raster cost (Class C). Two plates
  whose background-image is mutated per-frame (background-position shift),
  forcing a re-raster of the gradient each frame.

  bg_engine --consumer=null --blink-research=1 \
    --url="file://.../bench/bench-gradients.html" --fps=50 --duration=20 \
    --cache-dir=/tmp/bench-gradients
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  .plate {
    position: absolute; width: 900px; height: 600px;
    border-radius: 16px;
  }
  #lin {
    left: 60px; top: 100px;
    background-image: linear-gradient(90deg, #22d3ee 0%, #7c3aed 50%, #f43f5e 100%);
    background-size: 200% 100%;
  }
  #rad {
    left: 1000px; top: 100px;
    background-image: radial-gradient(circle at 50% 50%, #f59e0b 0%, #ef4444 40%, #1e1b4b 80%);
    background-size: 120% 120%;
  }
</style>
</head>
<body>
<div id="stage">
  <div class="plate" id="lin"></div>
  <div class="plate" id="rad"></div>
</div>
<script>
(function () {
  const lin = document.getElementById('lin');
  const rad = document.getElementById('rad');
  let frame = 0;
  function step() {
    const t = (frame % 200) / 200;
    // Sweep background-position to force gradient re-raster.
    const px = (t * 100).toFixed(1);
    lin.style.backgroundPosition = px + '% 0';
    rad.style.backgroundPosition = (50 + Math.sin(t * Math.PI * 2) * 30).toFixed(1) + '% ' +
                                   (50 + Math.cos(t * Math.PI * 2) * 30).toFixed(1) + '%';
    frame++;
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);

  const beacon = document.createElement('div');
  beacon.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;pointer-events:none;';
  document.body.appendChild(beacon);
  let n = 0;
  (function tick() {
    n++;
    beacon.style.background = (n & 1) ? 'rgba(0,0,0,0.004)' : 'rgba(0,0,0,0.008)';
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
</html>
