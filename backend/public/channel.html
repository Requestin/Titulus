<!doctype html>
<!--
  backend/public/channel.html — the page bg_engine renders (DEVELOPMENT_PROMPT §10).

  Loaded by:
    - bg_engine (CEF OSR) with ?engine=1  -> fixed-step playback, host drives tick
    - browser / OBS·vMix browser source    -> rAF playback (transparent BGRA)
    - editor preview iframe                -> rAF playback

  Query params (§10):
    channel=<uuid>     channel id (default "default")
    engine=1           fixed-step playback at engine_fps (host ticks ChannelClient)
    engine_fps=50      fixed tick rate (channel fps)
    w=1920&h=1080      canvas size (stage is sized to this; CEF renders it 1:1)
    backend=host:port  WebSocket backend override (else page origin)
    hud=1              debug overlay (fps + WS status + active count)
    preview=1          browser preview mode (force rAF even if engine=1)

  CRITICAL (§10): a perpetual requestAnimationFrame heartbeat runs even when the
  template content is static — CEF's external begin-frame only paints on
  compositor damage, and without the heartbeat OnPaint stops after a static take.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Titulus Channel</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent;     /* BGRA alpha carries the key channel */
      overflow: hidden;
    }
    /* The stage holds the canvas-sized render root produced by TemplateRenderer.
       In engine mode the CEF view is exactly w×h, so we center the stage on it. */
    #stage {
      position: fixed; left: 0; top: 0;
      width: 100%; height: 100%;
      overflow: hidden;
    }
    /* Optional HUD (debug overlay) — never affects layout of the stage. */
    #hud {
      position: fixed; left: 8px; top: 8px;
      font: 12px/1.4 ui-monospace, "SFMono-Regular", Menlo, monospace;
      color: #22d3ee; background: rgba(0,0,0,.55);
      padding: 6px 8px; border-radius: 4px;
      pointer-events: none; display: none;
      white-space: pre;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <pre id="hud"></pre>

  <!-- bg-runtime.js is the IIFE bundle of @titulus/runtime (window.BG).
       Served by the backend at /bg-runtime.js (Vite proxies it in dev). -->
  <script src="/bg-runtime.js"></script>
  <script>
  (function () {
    'use strict';

    var BG = window.BG;
    if (!BG || !BG.ChannelClient) {
      console.error('[channel.html] window.BG.ChannelClient missing — bg-runtime.js failed to load');
      return;
    }

    var qs = new URLSearchParams(location.search);
    var channelId = qs.get('channel') || 'default';
    var engineMode = qs.get('engine') === '1' && qs.get('preview') !== '1';
    var engineFps = parseInt(qs.get('engine_fps') || '50', 10) || 50;
    var canvasW = parseInt(qs.get('w') || '1920', 10) || 1920;
    var canvasH = parseInt(qs.get('h') || '1080', 10) || 1080;
    var backend = qs.get('backend') || '';
    var hudOn = qs.get('hud') === '1';

    var stage = document.getElementById('stage');
    var hud = document.getElementById('hud');
    if (hudOn) hud.style.display = 'block';

    // The TemplateRenderer sizes its canvas root to the template's canvas; we
    // fit the stage to the engine view. In engine mode the view == canvas size,
    // so 1:1. In browser mode we letterbox via the renderer's resize().

    var lastStatus = 'disconnected';
    var lastActive = 0;
    // Last reported RenderStats (Phase 9.1) — updated via onFrame; surfaced in
    // the hud overlay so the engine smoke / bench harness can read it.
    var lastStats = null;
    var client = new BG.ChannelClient({
      stage: stage,
      channelId: channelId,
      backend: backend || null,
      playbackMode: engineMode ? 'fixed' : 'raf',
      fixedTickRate: engineFps,
      onStatus: function (s) { lastStatus = s; paintHud(); },
      onActiveCount: function (n) { lastActive = n; paintHud(); },
      onFrame: function (info) {
        if (info.stats) {
          lastStats = info.stats;
          if (hudOn) paintHud();
        }
      }
    });
    client.connect();

    // --- Engine fixed-step bridge -----------------------------------------
    // When engineMode, the CEF host wants us to advance the timeline at exactly
    // engine_fps. We don't have a native "BeginFrame" hook into JS, so we drive
    // ChannelClient.tick() from a wall-clock interval quantized to engine_fps.
    // (The host's own frame pacing keeps CEF painting at the channel rate; this
    // interval only advances the timeline playhead deterministically.)
    var tickInterval = null;
    if (engineMode) {
      var tickMs = Math.round(1000 / engineFps);
      tickInterval = setInterval(function () { client.tick(); }, tickMs);
    }

    // --- Perpetual rAF heartbeat (§10) ------------------------------------
    // CEF OSR paints only on real compositor damage. The old sub-pixel opacity
    // nudge (0.9995..1.0) quantizes back to the same pixels — the compositor
    // optimizes it away and static takes stop producing OnPaint, while video
    // caps the whole channel at the video's own fps.
    //
    // Damage beacon instead: a 1x1 fixed pixel alternating between alpha 1/255
    // and 2/255 every rAF frame. Invisible on air (keyed graphics never carry
    // alpha<3/255 meaningfully) but it is REAL damage, so the compositor
    // submits a correctly-composited frame at windowless_frame_rate (50fps)
    // through the normal renderer->compositor->capturer path. Do NOT replace
    // this with host-side Invalidate() — flooding the CEF capturer with
    // refresh requests delivers blank buffers (black flicker on SDI).
    var beacon = document.createElement('div');
    beacon.style.cssText =
      'position:fixed;left:0;top:0;width:1px;height:1px;' +
      'pointer-events:none;z-index:2147483647;';
    document.body.appendChild(beacon);

    var frameCount = 0;
    var lastHudPaint = 0;
    function heartbeat(t) {
      frameCount++;
      beacon.style.background =
        (frameCount & 1) ? 'rgba(0,0,0,0.004)' : 'rgba(0,0,0,0.008)';
      if (hudOn && t - lastHudPaint > 250) {
        lastHudPaint = t;
        paintHud(t);
      }
      requestAnimationFrame(heartbeat);
    }
    requestAnimationFrame(heartbeat);

    function paintHud(t) {
      if (!hudOn) return;
      var lines = [
        'channel=' + channelId + ' mode=' + (engineMode ? 'fixed@' + engineFps : 'raf'),
        'ws=' + lastStatus + '  active=' + lastActive,
        'rAF=' + frameCount + (t !== undefined ? '  t=' + Math.round(t) + 'ms' : '')
      ];
      if (lastStats) {
        // RenderStats: lower styleWrites / higher skippedWrites = dirty-check
        // doing its job. frameTimeMs is the applyState wall-clock cost.
        lines.push(
          'stats: writes=' + lastStats.styleWrites +
          ' skipped=' + lastStats.skippedWrites +
          ' frame=' + lastStats.frameTimeMs.toFixed(2) + 'ms'
        );
      }
      hud.textContent = lines.join('\n');
    }

    // --- Resize handling --------------------------------------------------
    function fitStage() {
      // The renderer handles letterboxing via resize(); we just keep the stage
      // full-bleed (CSS already does). Provided for future preview scaling.
    }
    window.addEventListener('resize', fitStage);
    fitStage();

    // Expose for debugging in the CEF DevTools (when remote-debugging enabled).
    window.__titulus = { client: client, stage: stage };
  })();
  </script>
</body>
</html>
