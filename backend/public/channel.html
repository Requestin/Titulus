<!doctype html>
<!--
  backend/public/channel.html — the page bg_engine renders (DEVELOPMENT_PROMPT §10).

  Loaded by:
    - bg_engine (CEF OSR) with ?engine=1  -> fixed-step playback, host drives tick
    - browser / OBS·vMix browser source    -> rAF playback (transparent BGRA)
    - editor preview iframe                -> rAF playback

  Query params (§10):
    channel=<uuid>     channel id (default "default")
    engine=1           fixed-step playback at engine_fps (host ticks ChannelClient)
    engine_fps=50      fixed tick rate (channel fps)
    w=1920&h=1080      canvas size (stage is sized to this; CEF renders it 1:1)
    backend=host:port  WebSocket backend override (else page origin)
    hud=1              debug overlay (fps + WS status + active count)
    preview=1          browser preview mode (force rAF even if engine=1)

  CRITICAL (§10): a perpetual requestAnimationFrame heartbeat runs even when the
  template content is static — CEF's external begin-frame only paints on
  compositor damage, and without the heartbeat OnPaint stops after a static take.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Titulus Channel</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent;     /* BGRA alpha carries the key channel */
      overflow: hidden;
    }
    /* The stage holds the canvas-sized render root produced by TemplateRenderer.
       In engine mode the CEF view is exactly w×h, so we center the stage on it. */
    #stage {
      position: fixed; left: 0; top: 0;
      width: 100%; height: 100%;
      overflow: hidden;
    }
    /* Optional HUD (debug overlay) — never affects layout of the stage. */
    #hud {
      position: fixed; left: 8px; top: 8px;
      font: 12px/1.4 ui-monospace, "SFMono-Regular", Menlo, monospace;
      color: #22d3ee; background: rgba(0,0,0,.55);
      padding: 6px 8px; border-radius: 4px;
      pointer-events: none; display: none;
      white-space: pre;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <pre id="hud"></pre>

  <!-- bg-runtime.js is the IIFE bundle of @titulus/runtime (window.BG).
       Served by the backend at /bg-runtime.js (Vite proxies it in dev). -->
  <script src="/bg-runtime.js"></script>
  <script>
  (function () {
    'use strict';

    var BG = window.BG;
    if (!BG || !BG.ChannelClient) {
      console.error('[channel.html] window.BG.ChannelClient missing — bg-runtime.js failed to load');
      return;
    }

    var qs = new URLSearchParams(location.search);
    var channelId = qs.get('channel') || 'default';
    var engineMode = qs.get('engine') === '1' && qs.get('preview') !== '1';
    var engineFps = parseInt(qs.get('engine_fps') || '50', 10) || 50;
    var canvasW = parseInt(qs.get('w') || '1920', 10) || 1920;
    var canvasH = parseInt(qs.get('h') || '1080', 10) || 1080;
    var backend = qs.get('backend') || '';
    var hudOn = qs.get('hud') === '1';
    // Phase 19 doc 01: opt-in runtime style-write stats. When ?stats=1, emit a
    // "BGSTATS" console line every ~5s that bg_engine's OnConsoleMessage
    // forwards to its log. Aggregates RenderStats deltas across frames so we
    // can see how many DOM writes per frame the template actually costs.
    var statsOn = qs.get('stats') === '1';
    // P20.1 provenance is opt-in. It records the runtime's own rAF/timeline
    // state, not a claim that a console event acknowledges a particular paint.
    var pacingOn = engineMode && qs.get('pacing') === '1'
      && typeof BG.encodePacingEvent === 'function';

    var stage = document.getElementById('stage');
    var hud = document.getElementById('hud');
    if (hudOn) hud.style.display = 'block';

    // The TemplateRenderer sizes its canvas root to the template's canvas; we
    // fit the stage to the engine view. In engine mode the view == canvas size,
    // so 1:1. In browser mode we letterbox via the renderer's resize().

    var lastStatus = 'disconnected';
    var lastActive = 0;
    // ?stats=1 aggregation state (Phase 19 doc 01 instrumentation).
    var statsAgg = { frames: 0, writes: 0, skipped: 0, frameMs: 0,
                     maskWrites: 0, textWrites: 0, since: 0 };
    function accumulateStats(s) {
      statsAgg.frames += 1;
      statsAgg.writes += s.styleWrites || 0;
      statsAgg.skipped += s.skippedWrites || 0;
      statsAgg.frameMs += s.frameTimeMs || 0;
      statsAgg.maskWrites += s.maskWrites || 0;
      statsAgg.textWrites += s.textWrites || 0;
      var now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
      if (statsAgg.since === 0) { statsAgg.since = now; return; }
      if (now - statsAgg.since >= 5000 && statsAgg.frames > 0) {
        var f = statsAgg.frames;
        console.log('BGSTATS frames=' + f +
          ' writes/f=' + (statsAgg.writes / f).toFixed(1) +
          ' skipped/f=' + (statsAgg.skipped / f).toFixed(1) +
          ' mask/f=' + (statsAgg.maskWrites / f).toFixed(1) +
          ' text/f=' + (statsAgg.textWrites / f).toFixed(1) +
          ' applyMs/f=' + (statsAgg.frameMs / f).toFixed(3));
        statsAgg = { frames: 0, writes: 0, skipped: 0, frameMs: 0,
                     maskWrites: 0, textWrites: 0, since: now };
      }
    }
    // Last reported RenderStats (Phase 9.1) — updated via onFrame; surfaced in
    // the hud overlay so the engine smoke / bench harness can read it.
    var lastStats = null;
    var client = new BG.ChannelClient({
      stage: stage,
      channelId: channelId,
      backend: backend || null,
      playbackMode: engineMode ? 'fixed' : 'raf',
      fixedTickRate: engineFps,
      onStatus: function (s) { lastStatus = s; paintHud(); },
      onActiveCount: function (n) { lastActive = n; paintHud(); },
      onFrame: function (info) {
        if (info.stats) {
          lastStats = info.stats;
          if (hudOn) paintHud();
          if (statsOn) accumulateStats(info.stats);
        }
      }
    });
    client.connect();

    // --- Engine fixed-step bridge -----------------------------------------
    // Phase 11.2: the timeline used to advance on a wall-clock setInterval,
    // completely independent from the rAF heartbeat below (which is what
    // actually drives CEF's external-begin-frame paint). Two independent
    // ~50Hz clocks drift against each other under load — the render pump
    // could paint mid-tick or skip a tick relative to setInterval's own
    // timer, which reads as animation judder even when both clocks are
    // individually "on time". Fixed-step accumulator on the SAME rAF
    // timestamp used for painting instead: exactly one JS clock, ticking in
    // lockstep with whatever actually drives rAF (bg_engine's BeginFrame in
    // engine mode; the display's vsync in plain browser preview — see the
    // 'raf' playbackMode branch above, untouched by this).
    var tickAccumMs = 0;
    var lastTickT = null;
    var tickStepMs = 1000 / engineFps;
    // Cap catch-up debt so a stall (tab backgrounded, debugger pause) can't
    // fire a runaway burst of ticks once rAF resumes.
    var maxTickDebtMs = tickStepMs * 4;

    // --- Perpetual rAF heartbeat (§10) ------------------------------------
    // CEF OSR paints only on real compositor damage. The old sub-pixel opacity
    // nudge (0.9995..1.0) quantizes back to the same pixels — the compositor
    // optimizes it away and static takes stop producing OnPaint, while video
    // caps the whole channel at the video's own fps.
    //
    // Damage beacon instead: a 1x1 fixed pixel alternating between alpha 1/255
    // and 2/255 every rAF frame. Invisible on air (keyed graphics never carry
    // alpha<3/255 meaningfully) but it is REAL damage, so the compositor
    // submits a correctly-composited frame at windowless_frame_rate (50fps)
    // through the normal renderer->compositor->capturer path. Do NOT replace
    // this with host-side Invalidate() — flooding the CEF capturer with
    // refresh requests delivers blank buffers (black flicker on SDI).
    var beacon = document.createElement('div');
    beacon.style.cssText =
      'position:fixed;right:0;bottom:0;width:1px;height:1px;' +
      'pointer-events:none;z-index:2147483647;';
    document.body.appendChild(beacon);

    var frameCount = 0;
    var lastHudPaint = 0;
    var pacingEventSeq = 0;
    var lastPacingT = null;
    function heartbeat(t) {
      frameCount++;
      beacon.style.background =
        (frameCount & 1) ? 'rgba(0,0,0,0.004)' : 'rgba(0,0,0,0.008)';

      var ticksThisRaf = 0;
      var identityBefore = pacingOn ? client.getPacingIdentity() : null;
      if (engineMode) {
        if (lastTickT === null) lastTickT = t;
        tickAccumMs += t - lastTickT;
        lastTickT = t;
        if (tickAccumMs > maxTickDebtMs) tickAccumMs = maxTickDebtMs;
        while (tickAccumMs >= tickStepMs) {
          client.tick();
          tickAccumMs -= tickStepMs;
          ticksThisRaf++;
        }
      }

      if (pacingOn) {
        var identityAfter = client.getPacingIdentity();
        var identityValid = identityBefore.identityValid
          && identityAfter.identityValid
          && identityBefore.templateId === identityAfter.templateId;
        var line = BG.encodePacingEvent({
          runtimeEventSeq: ++pacingEventSeq,
          rafSeq: frameCount,
          runtimePerfUs: Math.round(t * 1000),
          runtimeUnixUs: Date.now() * 1000,
          rafDeltaUs: lastPacingT === null ? 0 : Math.round((t - lastPacingT) * 1000),
          ticksPerRaf: ticksThisRaf,
          logicalFrameBefore: identityValid ? identityBefore.logicalFrame : 0,
          logicalFrameAfter: identityValid ? identityAfter.logicalFrame : 0,
          activeCount: identityAfter.activeCount,
          identityValid: identityValid,
          templateId: identityValid ? identityAfter.templateId : null,
          graphRevision: identityValid ? identityAfter.graphRevision : 0,
          stateRevision: identityValid ? identityAfter.stateRevision : 0
        });
        if (line) console.log(line);
        lastPacingT = t;
      }

      if (hudOn && t - lastHudPaint > 250) {
        lastHudPaint = t;
        paintHud(t);
      }
      requestAnimationFrame(heartbeat);
    }
    requestAnimationFrame(heartbeat);

    function paintHud(t) {
      if (!hudOn) return;
      var lines = [
        'channel=' + channelId + ' mode=' + (engineMode ? 'fixed@' + engineFps : 'raf'),
        'ws=' + lastStatus + '  active=' + lastActive,
        'rAF=' + frameCount + (t !== undefined ? '  t=' + Math.round(t) + 'ms' : '')
      ];
      if (lastStats) {
        // RenderStats: lower styleWrites / higher skippedWrites = dirty-check
        // doing its job. frameTimeMs is the applyState wall-clock cost.
        lines.push(
          'stats: writes=' + lastStats.styleWrites +
          ' skipped=' + lastStats.skippedWrites +
          ' frame=' + lastStats.frameTimeMs.toFixed(2) + 'ms'
        );
      }
      hud.textContent = lines.join('\n');
    }

    // --- Resize handling --------------------------------------------------
    function fitStage() {
      // The renderer handles letterboxing via resize(); we just keep the stage
      // full-bleed (CSS already does). Provided for future preview scaling.
    }
    window.addEventListener('resize', fitStage);
    fitStage();

    // Expose for debugging in the CEF DevTools (when remote-debugging enabled).
    // Doc02 PR5: setLayerVisibilityFilter is the per-layer snapshot capture
    // hook used by the engine when BG_LAYERED_COMPOSITOR=1 is active.
    window.__titulus = {
      client: client,
      stage: stage,
      setLayerVisibilityFilter: function (templateId, visibleIds) {
        client.setLayerVisibilityFilter(templateId, visibleIds);
      },
      setLayerCaptureMode: function (templateId, layerId, padding, captureSeq) {
        return client.setLayerCaptureMode(templateId, layerId, padding, captureSeq);
      },
    };
  })();
  </script>
</body>
</html>
